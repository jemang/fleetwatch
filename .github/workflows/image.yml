name: Publish Hub image

# Builds deploy/Dockerfile.hub for amd64 and arm64 and pushes it to ghcr.io
# when a release tag is pushed:
#   git tag v0.1.2 && git push origin v0.1.2
# The tag without its "v" is the version stamped into the Hub and the agent
# files and the image tag; the image is also tagged latest.
# Needs the repository secret SIGNING_KEY: the content of release/signing-key.pem.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without v), for a manual run"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag or the input
        id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then v="$INPUT_VERSION"; else v="${GITHUB_REF_NAME#v}"; fi
          # Only a plain version is accepted as an image tag.
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' || { echo "Not a version: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Check the signing key is set
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "Add the repository secret SIGNING_KEY (content of release/signing-key.pem)."; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.hub
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          # Mounted at /run/secrets/signing_key for the signing step only; stored in no layer.
          secrets: signing_key=${{ secrets.SIGNING_KEY }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/fleetwatch-hub:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/fleetwatch-hub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
